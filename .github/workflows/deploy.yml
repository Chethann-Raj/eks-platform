name: Deploy to staging

# Matches the ci_deploy trust policy in terraform/persistent/oidc.tf
# exactly: repo:Chethann-Raj/eks-platform:ref:refs/heads/main. A
# workflow_dispatch or PR trigger would not match that `sub` claim and the
# OIDC assume-role step below would simply fail - deliberately, not by
# accident.
on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # No static AWS keys anywhere in this workflow - the runner exchanges
      # its GitHub-issued OIDC token for short-lived credentials by
      # assuming ci_deploy directly.
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.CI_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: ecr_login
        uses: aws-actions/amazon-ecr-login@v2.1.7

      # ECR is IMMUTABLE (terraform/persistent): PutImage on a tag that
      # already exists returns ImageAlreadyExistsException, it doesn't
      # silently overwrite. That's exactly right for a tag meant to be
      # traceable to one commit - but it also means a re-run of this
      # workflow for the same commit (normal when the earlier run failed
      # at the `helm upgrade` step, not the build) would die here in the
      # build step for no reason, since the image from the first run's
      # build already exists. Skip the build+push in that case rather than
      # let it fail.
      - name: Check if this commit's image already exists in ECR
        id: check_image
        env:
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          if aws ecr describe-images \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids imageTag="$IMAGE_TAG" \
              --region "${{ vars.AWS_REGION }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push image
        if: steps.check_image.outputs.exists != 'true'
        env:
          ECR_REGISTRY: ${{ steps.ecr_login.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" app/
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Point kubectl/helm at the staging cluster
        run: |
          aws eks update-kubeconfig \
            --name "${{ vars.EKS_CLUSTER_NAME }}" \
            --region "${{ vars.AWS_REGION }}"

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: "v4.2.4"

      # -n staging only, no --create-namespace: ci_deploy has
      # AmazonEKSEditPolicy scoped to the "staging" namespace alone
      # (envs/staging/main.tf) - it cannot create namespaces, install
      # CRDs, or touch the ClusterSecretStore (that lives in
      # terraform/modules/addons/, applied by Terraform, not here). The
      # "staging" namespace itself is created by Terraform
      # (terraform/modules/addons/staging_namespace.tf) precisely so this
      # step never needs to.
      - name: helm upgrade --install
        env:
          ECR_REGISTRY: ${{ steps.ecr_login.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          helm upgrade --install app charts/app \
            --namespace staging \
            --wait \
            --atomic \
            --timeout 5m \
            --set image.repository="$ECR_REGISTRY/$ECR_REPOSITORY" \
            --set image.tag="$IMAGE_TAG" \
            --set database.host="${{ vars.RDS_HOST }}" \
            --set database.port="${{ vars.RDS_PORT }}" \
            --set database.name="${{ vars.RDS_DB_NAME }}" \
            --set database.secretArn="${{ vars.RDS_SECRET_ARN }}" \
            --set ingress.certificateArn="${{ vars.ACM_CERTIFICATE_ARN }}" \
            --set ingress.host="${{ vars.APP_HOSTNAME }}"
