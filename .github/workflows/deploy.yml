name: Deploy to staging

# Matches the ci_deploy trust policy in terraform/persistent/oidc.tf
# exactly: repo:Chethann-Raj/eks-platform:ref:refs/heads/main. A
# workflow_dispatch or PR trigger would not match that `sub` claim and the
# OIDC assume-role step below would simply fail - deliberately, not by
# accident.
on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  # No `permissions:` override here - the workflow-level block above grants
  # id-token: write / contents: read to every job by default, but this job
  # never uses configure-aws-credentials, so it never actually exchanges
  # that token for anything. It needs no AWS credentials and assumes no role.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # 3.12 to match app/Dockerfile's python:3.12-slim base - tests run
      # against the same interpreter version the image actually ships.
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r app/requirements.txt -r app/requirements-dev.txt

      - name: Run tests
        run: pytest app/tests

  deploy:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      # Consumed by the `production` job below to deploy the exact bytes
      # staging just ran, by digest - not by re-resolving the tag, which
      # could in principle move (ECR immutability protects PutImage on this
      # tag, not a promise that "resolve this tag again later" is
      # meaningless - digest pinning removes that ambiguity entirely).
      image_digest: ${{ steps.resolve_digest.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # No static AWS keys anywhere in this workflow - the runner exchanges
      # its GitHub-issued OIDC token for short-lived credentials by
      # assuming ci_deploy directly.
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.CI_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: ecr_login
        uses: aws-actions/amazon-ecr-login@v2.1.7

      # ECR is IMMUTABLE (terraform/persistent): PutImage on a tag that
      # already exists returns ImageAlreadyExistsException, it doesn't
      # silently overwrite. That's exactly right for a tag meant to be
      # traceable to one commit - but it also means a re-run of this
      # workflow for the same commit (normal when the earlier run failed
      # at the `helm upgrade` step, not the build) would die here in the
      # build step for no reason, since the image from the first run's
      # build already exists. Skip the build+push in that case rather than
      # let it fail.
      - name: Check if this commit's image already exists in ECR
        id: check_image
        env:
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set +e
          DESCRIBE_STDERR=$(aws ecr describe-images \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids imageTag="$IMAGE_TAG" \
              --region "${{ vars.AWS_REGION }}" 2>&1 >/dev/null)
          DESCRIBE_STATUS=$?
          set -e

          if [ "$DESCRIBE_STATUS" -eq 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif echo "$DESCRIBE_STDERR" | grep -q "ImageNotFoundException"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            # Any other failure (auth, throttling, wrong repo name, ...) is
            # not "the image doesn't exist yet" - failing loudly here beats
            # silently falling through to a build+push that may then also
            # fail for the same underlying reason, or worse, mask it.
            echo "::error::aws ecr describe-images failed for a reason other than ImageNotFoundException: $DESCRIBE_STDERR"
            exit 1
          fi

      - name: Build and push image
        if: steps.check_image.outputs.exists != 'true'
        env:
          ECR_REGISTRY: ${{ steps.ecr_login.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" app/
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      # Runs unconditionally (no `if:`) - unlike the build step above, this
      # must resolve the digest whether the image was just pushed by this
      # run or already existed from an earlier one. Same guard shape as
      # "Check if this commit's image already exists in ECR" above: capture
      # stderr under `set +e`, restore `set -e`, then fail loudly with
      # `::error::` on anything other than a clean resolution - a missing
      # or empty digest here must never fall through into `production`
      # deploying nothing/garbage by digest.
      - name: Resolve pushed image digest
        id: resolve_digest
        env:
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set +e
          DIGEST=$(aws ecr describe-images \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids imageTag="$IMAGE_TAG" \
              --region "${{ vars.AWS_REGION }}" \
              --query 'imageDetails[0].imageDigest' \
              --output text 2>&1)
          DESCRIBE_STATUS=$?
          set -e

          if [ "$DESCRIBE_STATUS" -ne 0 ] || [ -z "$DIGEST" ] || [ "$DIGEST" = "None" ]; then
            echo "::error::aws ecr describe-images failed to resolve a digest for tag $IMAGE_TAG: $DIGEST"
            exit 1
          fi

          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Point kubectl/helm at the staging cluster
        run: |
          aws eks update-kubeconfig \
            --name "${{ vars.EKS_CLUSTER_NAME }}" \
            --region "${{ vars.AWS_REGION }}"

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: "v4.2.4"

      # -n staging only, no --create-namespace: ci_deploy has
      # AmazonEKSEditPolicy scoped to the "staging" namespace alone
      # (envs/staging/main.tf) - it cannot create namespaces, install
      # CRDs, or touch the ClusterSecretStore (that lives in
      # terraform/modules/addons/, applied by Terraform, not here). The
      # "staging" namespace itself is created by Terraform
      # (terraform/modules/addons/staging_namespace.tf) precisely so this
      # step never needs to.
      - name: helm upgrade --install
        env:
          ECR_REGISTRY: ${{ steps.ecr_login.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          helm upgrade --install app charts/app \
            --namespace staging \
            --wait \
            --rollback-on-failure \
            --timeout 10m \
            --set image.repository="$ECR_REGISTRY/$ECR_REPOSITORY" \
            --set image.tag="$IMAGE_TAG" \
            --set database.host="${{ vars.RDS_HOST }}" \
            --set database.port="${{ vars.RDS_PORT }}" \
            --set database.name="${{ vars.RDS_DB_NAME }}" \
            --set database.secretArn="${{ vars.RDS_SECRET_ARN }}" \
            --set ingress.certificateArn="${{ vars.ACM_CERTIFICATE_ARN }}" \
            --set ingress.host="${{ vars.APP_HOSTNAME }}"

      # Two separate poll loops, deliberately not merged: an ALB that never
      # gets provisioned (AWS Load Balancer Controller / IAM / subnet
      # tagging) and a site that never answers once the ALB exists (DNS
      # propagation, ExternalDNS, target-group health, ACM) are different
      # failure domains with different fixes - the log needs to say which
      # one broke, not just "smoke test failed".
      - name: Smoke test
        if: success()
        run: |
          set -euo pipefail

          echo "Waiting for Ingress 'app' to be assigned an ALB hostname (max 5m, 10s interval)..."
          ALB_HOSTNAME=""
          for i in $(seq 1 30); do
            ALB_HOSTNAME=$(kubectl -n staging get ingress app \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' || true)
            echo "  [$i/30] ingress hostname: '${ALB_HOSTNAME:-<empty>}'"
            if [ -n "$ALB_HOSTNAME" ]; then
              break
            fi
            sleep 10
          done
          if [ -z "$ALB_HOSTNAME" ]; then
            echo "::error::Ingress 'app' never got an ALB hostname after 5 minutes - this is ALB provisioning (AWS Load Balancer Controller), not DNS."
            exit 1
          fi
          echo "ALB hostname: $ALB_HOSTNAME"

          echo "Waiting for https://${{ vars.APP_HOSTNAME }} to return 200 (max 5m, 15s interval)..."
          HTTP_CODE=""
          for i in $(seq 1 20); do
            HTTP_CODE=$(curl -fsS -o /dev/null -w '%{http_code}' "https://${{ vars.APP_HOSTNAME }}" || true)
            echo "  [$i/20] http_code: '${HTTP_CODE:-<none>}'"
            if [ "$HTTP_CODE" = "200" ]; then
              break
            fi
            sleep 15
          done
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::https://${{ vars.APP_HOSTNAME }} never returned 200 after 5 minutes (last code: '${HTTP_CODE:-<none>}') - ALB hostname resolved fine above, so look at DNS/ExternalDNS, target-group health, or the ACM certificate, not ALB provisioning."
            exit 1
          fi
          echo "Site responded 200."

          echo "Verifying the response body reflects a real DB read..."
          BODY=$(curl -fsS "https://${{ vars.APP_HOSTNAME }}/api/stats")
          echo "  body: $BODY"
          if ! echo "$BODY" | grep -q '"visits"'; then
            echo "::error::Response body is missing the DB-backed 'visits' field (app/main.py's /api/stats endpoint) - got: $BODY"
            exit 1
          fi
          echo "Smoke test passed."

  # PRODUCTION_ENABLED is deliberately unset as a repository variable right
  # now - an unset vars.* evaluates to an empty string, so this `if:` is
  # false and the job renders in the run as "skipped", not stuck pending
  # forever waiting on the "production" GitHub Environment's reviewers
  # against a cluster (terraform/envs/production) that isn't fully wired up
  # yet - see terraform/envs/production/main.tf's ci_deploy access entry
  # and CHALLENGES.md for what's still missing. Flip vars.PRODUCTION_ENABLED
  # to "true" only once that's resolved.
  production:
    needs: [test, deploy]
    if: github.ref == 'refs/heads/main' && vars.PRODUCTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    # A required-reviewers GitHub Environment - already created out of band
    # (not by this workflow or by Terraform; GitHub Environments aren't a
    # Terraform-managed resource here). Declaring `environment:` is also
    # what makes GitHub mint the OIDC token with `sub` ending in
    # ":environment:production" rather than ":ref:refs/heads/main" -
    # exactly the claim terraform/persistent/oidc.tf's
    # data.aws_iam_policy_document.ci_production_trust checks for. url is
    # informational only (shown as this job's environment link in the GitHub
    # UI); it does not have to be a distinct hostname from staging's to be
    # valid here.
    environment:
      name: production
      url: https://chethanraj.site
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # secrets.AWS_ACCOUNT_ID, not a literal account ID - this repo is
      # public and the account ID must never be committed to it.
      # eks-platform-ci-production is the role
      # terraform/persistent/oidc.tf's aws_iam_role.ci_production actually
      # creates - there is no repository variable holding this ARN the way
      # vars.CI_DEPLOY_ROLE_ARN does for the `deploy` job above; role name
      # plus account ID is assembled here instead.
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/eks-platform-ci-production
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: ecr_login
        uses: aws-actions/amazon-ecr-login@v2.1.7

      - name: Point kubectl/helm at the production cluster
        run: |
          aws eks update-kubeconfig \
            --name eks-platform-production \
            --region "${{ vars.AWS_REGION }}"

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: "v4.2.4"

      # By digest (needs.deploy.outputs.image_digest), not by tag - see
      # charts/app/templates/deployment.yaml and values.yaml's image.digest.
      # No --create-namespace, same reasoning as the staging job's helm
      # upgrade above: whatever IAM policy eks-platform-ci-production ends
      # up with should stay namespace-scoped, not able to create namespaces
      # cluster-wide. The "production" namespace itself needs to come from
      # Terraform once terraform/modules/addons supports a namespace other
      # than the "staging" it currently hardcodes (see CHALLENGES.md) - this
      # step will fail against a missing namespace until that's done, which
      # is fine while vars.PRODUCTION_ENABLED keeps this job from running at
      # all.
      #
      # database.*/ingress.* below read from PROD_-prefixed repository
      # variables, deliberately distinct from staging's vars.RDS_HOST etc. -
      # reusing staging's variables here would point this release at
      # staging's own RDS instance and certificate instead of production's
      # own. None of these PROD_* variables exist yet either; configuring
      # them is part of what has to happen before vars.PRODUCTION_ENABLED
      # can safely flip to "true".
      - name: helm upgrade --install
        env:
          ECR_REGISTRY: ${{ steps.ecr_login.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_DIGEST: ${{ needs.deploy.outputs.image_digest }}
        run: |
          helm upgrade --install app charts/app \
            --namespace production \
            --wait \
            --rollback-on-failure \
            --timeout 5m \
            --set image.repository="$ECR_REGISTRY/$ECR_REPOSITORY" \
            --set image.digest="$IMAGE_DIGEST" \
            --set database.host="${{ vars.PROD_RDS_HOST }}" \
            --set database.port="${{ vars.PROD_RDS_PORT }}" \
            --set database.name="${{ vars.PROD_RDS_DB_NAME }}" \
            --set database.secretArn="${{ vars.PROD_RDS_SECRET_ARN }}" \
            --set ingress.certificateArn="${{ vars.PROD_ACM_CERTIFICATE_ARN }}" \
            --set ingress.host="${{ vars.PROD_APP_HOSTNAME }}"
