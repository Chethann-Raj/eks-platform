# Namespaced, unlike ClusterSecretStore (which lives in
# terraform/modules/addons/ instead - see its README) - this is exactly
# the kind of object the namespace-scoped ci_deploy role IS allowed to
# apply via `helm upgrade -n staging`.
#
# Only username/password are pulled from the AWS secret - those are the
# two keys the RDS "manage master credentials in Secrets Manager" feature
# is documented to guarantee. Host/port/dbname are deliberately NOT
# sourced from this secret (its JSON schema beyond username/password isn't
# something AWS documents as guaranteed for this feature) - they come from
# plain Helm values instead (charts/app/values.yaml's database.host/port/
# name), which are not secret at all.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "app.fullname" . }}-db-credentials
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: {{ include "app.fullname" . }}-db-credentials
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.database.secretArn | quote }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.database.secretArn | quote }}
        property: password
