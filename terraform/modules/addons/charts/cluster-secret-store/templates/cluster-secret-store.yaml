# No spec.provider.aws.auth block: External Secrets Operator's own
# controller pod already runs as the IRSA-annotated "external-secrets"
# service account (see ../../external_secrets.tf) - the AWS SDK picks up
# those credentials from the pod's own environment by default. A
# serviceAccountRef here would only be needed to impersonate a *different*
# service account than the one the controller itself runs as.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.name }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.region }}
